marketing_data:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"

  meta:
    base: &base
      type: databricks
      threads: 8
    base_auth: &base_auth
      type: databricks
      auth_type: oauth
      client_id: "{{ env_var('DBX_ID_APPLICATION_ID') }}"
      client_secret: "{{ env_var('DBX_SECRET') }}"
      threads: 8
      connect_retries: 3
      retry_all: true

  outputs:
    # Local development: authenticates as you, with a personal token
    dev: &dev_target
      <<: *base
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DEV_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_PAT_TOKEN') }}"
      catalog: "{{ env_var('DEV_CATALOG') }}"
      schema: "{{ env_var('DEV_SCHEMA') }}"

    # Pull request validation: runs in the pipeline, isolated schema per run
    ci: &ci_target
      <<: *base_auth
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('CI_HTTP_PATH') }}"
      catalog: "{{ env_var('CI_CATALOG') }}"
      schema: "{{ env_var('CI_SCHEMA') }}"

    # Production: authenticates as the Service Principal (OAuth), no personal token
    prod: &prod_target
      <<: *base_auth
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('PROD_HTTP_PATH') }}"
      catalog: "{{ env_var('PROD_CATALOG') }}"
      schema: "{{ env_var('PROD_SCHEMA') }}"

elementary:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      <<: *dev_target
      schema: "{{ env_var('DEV_SCHEMA') }}_elementary"
    ci:
      <<: *ci_target
      schema: "{{ env_var('CI_SCHEMA') }}_elementary"
    prod:
      <<: *prod_target
      schema: "{{ env_var('PROD_SCHEMA') }}_elementary"