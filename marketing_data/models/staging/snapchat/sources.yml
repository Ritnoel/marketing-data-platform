sources:
  - name: snapchat_ads
    database: raw_marketing
    description: data from snapchat plaform (static)
    schema: ads_schema
    config:
      enabled: true
      meta:
        owner: "@cde_engineer"
      freshness:
        warn_after:
          count: 2
          period: day

    tables:
      - name: snapchat_ads_ad_history_new_ad_names
        description: ads data from snapchat plaform (static)
        config:
          enabled: true
          event_time: ad_detail_updated_at

      - name: snapchat_ads_adgroup_history_new_ad_group_names
        description: adgroup data from snapchat platform (static)
        config:
          enabled: true
          event_time: ad_group_updated_at

      - name: snapchat_ads_campaign_history_new_campaign_names
        description: ads campaign data from snapchat platform (static)
        config:
          enabled: true

      - name: snapchat_ads_stats
        description: ads_stats data from snapchat plaform (static)
        config:
          enabled: true
          event_time: ad_date
