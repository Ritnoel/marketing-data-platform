version: 2

models:
  - name: facebook_snapchat_marketing_spend
    description: >
      Unified Facebook and Snapchat advertising performance, with ad, ad group
      and campaign names attached. Built from int_marketing_ads_stats and
      int_marketing_ads_details. Snapchat is summed across countries to match
      Facebook's grain.
      Grain: one row per ad, per day, per platform.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ad_id
              - ad_date
              - platform
    columns:
      - name: ad_id
        description: Ad identifier from the source platform. Only unique together with platform and date.
        data_tests:
          - not_null
      - name: ad_date
        description: Date the performance was recorded.
        data_tests:
          - not_null
      - name: platform
        description: Advertising platform the row comes from.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['facebook', 'snapchat']
      - name: ad_group_id
        description: Identifier of the ad group the ad belongs to, from the source platform. Null if the ad has no ad group.
      - name: campaign_id
        description: Identifier of the campaign the ad belongs to, from the source platform. Null if the ad has no ad group.
      - name: ad_name
        description: Name of the ad.
      - name: ad_group_name
        description: Name of the ad group. Null if the ad has no ad group.
      - name: campaign_name
        description: Name of the campaign. Null if the ad has no ad group.
      - name: channel_name
        description: Marketing channel the platform belongs to.
      - name: ad_detail_updated_at
        description: Latest update timestamp across the records the ad details were built from.
      - name: ad_currency_code
        description: Currency the spend is reported in. Spend should not be summed across different currencies.
      - name: ad_spend
        description: Amount spent on the ad that day, in the currency shown.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ad_impressions
        description: Number of times the ad was shown that day.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ad_clicks
        description: Number of clicks on the ad that day.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0